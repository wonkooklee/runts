name: Bug report
description: Something in RunTS does not work as expected
labels: [bug]
body:
  - type: textarea
    id: code
    attributes:
      label: Code
      description: The smallest snippet that reproduces the problem.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What RunTS showed. Screenshots are welcome.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RunTS version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.0, Apple Silicon"
    validations:
      required: true
