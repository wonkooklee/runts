<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' blob:"
    />
    <title>RunTS</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header id="titlebar">
      <div id="tabs" role="tablist"></div>
      <button id="new-tab" class="icon-btn" title="New Tab (⌘T)">+</button>
      <div class="titlebar-spacer"></div>
      <button id="run-btn" class="run-btn" title="Run (⌘R)">▶ Run</button>
      <button id="stop-btn" class="run-btn stop" title="Stop (⌘.)" hidden>■ Stop</button>
    </header>

    <main id="workspace" class="horizontal">
      <section id="editor-pane" class="pane"></section>
      <div id="divider" role="separator" aria-orientation="vertical"></div>
      <section id="output-pane" class="pane"></section>
    </main>

    <footer id="statusbar">
      <button id="lang-btn" class="status-btn" title="Switch Language (⇧⌘L)">TypeScript</button>
      <span id="run-status" class="status-text"></span>
      <div class="status-spacer"></div>
      <label class="status-toggle" title="Auto-Run (⇧⌘R)">
        <input type="checkbox" id="autorun-toggle" /> Auto-run
      </label>
      <button id="layout-btn" class="status-btn" title="Toggle Layout (⌘\)">⇆</button>
      <button id="packages-btn" class="status-btn" title="npm Packages (⇧⌘P)">Packages</button>
      <button id="settings-btn" class="status-btn" title="Settings (⌘,)">⚙︎</button>
      <span id="node-version" class="status-text dim"></span>
    </footer>

    <div id="modal-backdrop" hidden>
      <div id="packages-modal" class="modal" role="dialog" aria-labelledby="packages-title" hidden>
        <div class="modal-head">
          <h2 id="packages-title">npm Packages</h2>
          <button class="icon-btn modal-close" title="Close (Esc)">×</button>
        </div>
        <form id="install-form" class="row">
          <input id="install-input" type="text" placeholder="lodash dayjs@1 zod" autocomplete="off" spellcheck="false" />
          <button id="install-btn" type="submit" class="primary">Install</button>
        </form>
        <p class="hint">Installed packages are available to import and require right away. Bundled type definitions power completion.</p>
        <ul id="package-list"></ul>
        <pre id="package-log" hidden></pre>
        <div class="modal-foot">
          <button id="reveal-packages" class="link-btn">Show in Finder</button>
        </div>
      </div>

      <div id="settings-modal" class="modal" role="dialog" aria-labelledby="settings-title" hidden>
        <div class="modal-head">
          <h2 id="settings-title">Settings</h2>
          <button class="icon-btn modal-close" title="Close (Esc)">×</button>
        </div>
        <form id="settings-form" class="settings">
          <label>Theme
            <select name="theme">
              <option value="system">System</option>
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </label>
          <label>Font size <input name="fontSize" type="number" min="9" max="32" /></label>
          <label>Auto-run delay (ms) <input name="autoRunDelay" type="number" min="0" max="5000" step="50" /></label>
          <label>Inspect depth <input name="inspectDepth" type="number" min="0" max="20" /></label>
          <label class="check"><input name="autoRun" type="checkbox" /> Run automatically while typing</label>
          <label class="check"><input name="alignResults" type="checkbox" /> Align results with source lines</label>
          <label class="check"><input name="showUndefined" type="checkbox" /> Show undefined results</label>
          <label class="check"><input name="lineNumbers" type="checkbox" /> Line numbers</label>
          <label class="check"><input name="wordWrap" type="checkbox" /> Word wrap</label>
          <label class="check"><input name="minimap" type="checkbox" /> Minimap</label>
          <label class="wide">Environment variables <small>One KEY=VALUE per line, exposed as process.env</small>
            <textarea name="env" rows="5" spellcheck="false" placeholder="API_URL=https://example.com"></textarea>
          </label>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
